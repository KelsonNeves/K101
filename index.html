<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>K101-JOGOS — Jogos para jogar no navegador</title>
  <meta name="description" content="Jogos próprios da K101-JOGOS. Rode os jogos direto no seu navegador, no PC e no celular.">
  <link rel="canonical" href="https://k101.com.br/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="K101-JOGOS — Jogos para jogar no navegador">
  <meta property="og:description" content="Jogos próprios da K101-JOGOS. Rode os jogos direto no seu navegador, no PC e no celular.">
  <meta property="og:url" content="https://k101.com.br/">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/shared/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- identidade visual (cores, bordas, botões, formas, fonte): ÚNICO arquivo a editar para mudar a aparência -->
  <link rel="stylesheet" href="/shared/tema.css">
  <link rel="stylesheet" href="/site/catalogo.css">
</head>
<body>
  <!-- fundo discreto: manchas de luz que se movem devagar com a rolagem -->
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- faixa escura em degradê atrás da logo fixa: aparece quando a logo encolhe -->
  <div class="top-fade" aria-hidden="true"></div>

  <!-- logo principal: fixa na tela; começa grande sobre o espaço reservado da boas-vindas e encolhe até o topo central -->
  <a id="logo" class="logo" href="/" aria-label="K101 — página inicial">
    <img src="/shared/img/logo.svg" alt="K101">
  </a>

  <!-- Boas-vindas: ocupa a primeira tela inteira do aparelho -->
  <header class="hero" id="inicio">
    <div class="sky" aria-hidden="true">
      <i style="--t:12%;--l:8%;--d:13s;--dl:2s"></i>
      <i style="--t:30%;--l:52%;--d:17s;--dl:7s"></i>
      <i style="--t:8%;--l:62%;--d:19s;--dl:11s"></i>
      <i style="--t:48%;--l:20%;--d:23s;--dl:4s"></i>
      <i style="--t:22%;--l:82%;--d:29s;--dl:15s"></i>
    </div>

    <div class="hero-inner">
      <div id="logo-slot" class="logo-slot" aria-hidden="true"><img src="/shared/img/logo.svg" alt=""></div>
      <div class="copy">
        <h1>Jogos próprios da K101-JOGOS.</h1>
        <p>Rode os jogos direto no seu navegador. Todos os jogos são compatíveis com PC e Mobile.</p>
      </div>
    </div>

    <button id="cue" class="cue" type="button" aria-label="Ver os jogos">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
    </button>
  </header>

  <div class="wrap divider" role="separator"></div>

  <main class="wrap" id="jogos">
    <p id="status" class="status" role="status" hidden></p>

    <!-- esqueleto: aparece enquanto a lista carrega (internet lenta) -->
    <div id="skeleton" class="grid" aria-hidden="true">
      <div class="card sk"><span class="stage"><span class="icon is-loading"></span></span><span class="title"><i class="bar"></i></span></div>
      <div class="card sk"><span class="stage"><span class="icon is-loading"></span></span><span class="title"><i class="bar"></i></span></div>
      <div class="card sk"><span class="stage"><span class="icon is-loading"></span></span><span class="title"><i class="bar"></i></span></div>
      <div class="card sk"><span class="stage"><span class="icon is-loading"></span></span><span class="title"><i class="bar"></i></span></div>
    </div>
    <noscript><style>#skeleton{display:none}</style></noscript>

    <section id="grid" class="grid" aria-label="Jogos" hidden></section>
    <noscript><p class="status">Ative o JavaScript para ver a lista de jogos.</p></noscript>
  </main>

  <footer class="wrap foot">
    <span>© <span id="year">2026</span> K101-JOGOS</span>
    <span>Funciona no computador e no celular.</span>
  </footer>

  <!-- popup do jogo: preenchido por /site/catalogo.js -->
  <dialog id="game-modal" aria-labelledby="m-title">
    <div class="frame">
      <button id="m-close" class="x" type="button" aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="sheet">
        <header class="m-head">
          <div id="m-icon" class="m-icon"></div>
          <div class="m-title">
            <h2 id="m-title"></h2>
          </div>
        </header>

        <div id="m-shots-wrap" class="shots-wrap" hidden>
          <button id="m-prev" class="nav prev" type="button" aria-label="Imagem anterior">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div id="m-shots" class="shots" role="region" aria-label="Imagens do jogo" tabindex="0"></div>
          <button id="m-next" class="nav next" type="button" aria-label="Próxima imagem">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>

        <div class="m-body">
          <p id="m-desc" class="desc"></p>
          <ul id="m-tags" class="meta" aria-label="Categorias"></ul>
          <dl id="m-info" class="info"></dl>
        </div>

        <div class="m-foot">
          <a id="m-play" class="play big" href="/">Jogar</a>
        </div>
      </div>
    </div>
  </dialog>

  <!-- menu flutuante: aparece quando a tela de boas-vindas sai de vista -->
  <nav id="dock" class="dock" aria-label="Menu">
    <div id="dock-bar" class="dock-bar">
      <div id="dock-row" class="d-row">
        <button id="dock-search" class="d-btn" type="button" aria-expanded="false" aria-controls="search-form">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>Buscar</span><i class="dot" aria-hidden="true"></i>
        </button>
        <button id="dock-home" class="d-home" type="button" aria-label="Início">
          <img src="/shared/img/logo-icone.svg" alt="" width="44" height="44">
        </button>
        <button class="d-btn" type="button" aria-disabled="true" title="Em breve">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
          <span>Recentes</span>
        </button>
      </div>

      <form id="search-form" class="pane" role="search" autocomplete="off" inert>
        <button class="s-go" type="submit" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <input id="search" type="search" name="q" placeholder="Nome, descrição ou tag" aria-label="Buscar jogos" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="search-clear" class="s-clear" type="button" aria-label="Limpar busca" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button id="search-min" class="s-min" type="button" aria-label="Minimizar busca" title="Minimizar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
        </button>
      </form>
    </div>
  </nav>

  <script type="module" src="/site/catalogo.js"></script>
</body>
</html>
